[project]
name = "bureaucracy-copilot"
version = "0.1.0"
description = "Bilingual assistant that answers questions about German bureaucracy with citations to official sources."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
    "httpx>=0.28.1",
    "trafilatura>=2.3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copilot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F = errors, I = import sorting, B = common bugs, UP = modern syntax
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: tests that need a running Postgres with pgvector (skipped if DATABASE_URL is not set)",
]
