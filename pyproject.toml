[project]
name = "bureaucracy-copilot"
version = "0.1.0"
description = "Bilingual assistant that answers questions about German bureaucracy with citations to official sources."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
    "httpx>=0.28.1",
    "trafilatura>=2.3.1",
    "fastembed>=0.9.1",
    "pgvector>=0.5.1",
    "numpy>=2.5.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copilot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F = errors, I = import sorting, B = common bugs, UP = modern syntax
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: tests that need a running Postgres with pgvector (skipped if DATABASE_URL is not set)",
    "model: tests that download the embedding model (~220 MB, first run only)",
]

[tool.uv]
# The project must install on Intel Macs too: newer onnxruntime releases (used by the
# embedding model) dropped Intel-Mac support, so uv picks a version that still has it.
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
