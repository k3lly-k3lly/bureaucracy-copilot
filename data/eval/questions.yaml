# Test questions for the evaluation harness (python -m copilot.evaluate).
#
# Each question:
#   id:             short unique id, e.g. anm-05
#   question:       what a real student would type
#   language:       en or de (the answer must be in this language)
#   topic:          anmeldung | residence_permit | health_insurance | renting | banking | other
#   expected_urls:  sources that contain the answer (any one of them counts). Must be in sources.yaml.
#   must_include:   key facts the answer must mention. Alternatives with |, e.g. "14 days|two weeks"
#                   Keep facts short and specific: a number, a document name, a yes/no word.
#   should_refuse:  true for questions the sources cannot answer (then no urls/facts)
#   notes:          optional: why this question is interesting
#
# How to find expected_urls: uv run python -m copilot.ask "your question" --passages
# Aim for roughly: 70% answerable, 15% tricky (situation-dependent), 15% should_refuse.

questions:
  # --- Anmeldung (address registration) ------------------------------------------------------
  - id: anm-01
    question: How long do I have to register my address after moving?
    language: en
    topic: anmeldung
    expected_urls:
      - https://willkommenszentrum.berlin.de/en/housing/registration-residence
      - https://www.auslandsamt.tu-berlin.de/international_office/betreuung_internationaler_austauschstudierender/nach_der_anreise/anmeldung/parameter/en/
      - https://www.berlin.de/en/life/new-in-berlin/744279-8206946-moving-to-berlin-registration-offices.en.html
      - https://www.gesetze-im-internet.de/bmg/__17.html
      - https://service.berlin.de/dienstleistung/120686/
    must_include:
      - 14 days|two weeks|2 weeks
    notes: First real test (Nov 25) - answered correctly with TU Berlin citation.

  - id: anm-02
    question: Does registering my address cost anything?
    language: en
    topic: anmeldung
    expected_urls:
      - https://willkommenszentrum.berlin.de/en/housing/registration-residence
      - https://service.berlin.de/dienstleistung/120686/
    must_include:
      - free|no fee|no cost|no charge

  - id: anm-03
    question: What is the Wohnungsgeberbestätigung and who gives it to me?
    language: en
    topic: anmeldung
    expected_urls:
      - https://willkommenszentrum.berlin.de/en/glossary/landlords-confirmation-residence
      - https://www.auslandsamt.tu-berlin.de/international_office/betreuung_internationaler_austauschstudierender/nach_der_anreise/anmeldung/parameter/en/
      - https://service.berlin.de/dienstleistung/120686/
    must_include:
      - landlord|Vermieter

  - id: anm-04
    question: Innerhalb welcher Frist muss ich mich nach dem Einzug anmelden?
    language: de
    topic: anmeldung
    expected_urls:
      - https://www.gesetze-im-internet.de/bmg/__17.html
      - https://service.berlin.de/dienstleistung/120686/
      - https://willkommenszentrum.berlin.de/en/housing/registration-residence
    must_include:
      - zwei Wochen|14 Tage|14 Tagen
    notes: German question; the law (BMG 17) says "innerhalb von zwei Wochen".

  - id: anm-05
    question: I moved to Berlin from abroad. Do I also have only 14 days to register?
    language: en
    topic: anmeldung
    expected_urls:
      - https://www.auslandsamt.tu-berlin.de/international_office/betreuung_internationaler_austauschstudierender/nach_der_anreise/anmeldung/parameter/en/
    must_include:
      - three months|3 months
    notes: Tricky - sources disagree (14 days vs 3 months from abroad). See eval_notes.md.

